<script>
(() => {
"use strict";

const $ = id => document.getElementById(id);

/* -------------------------------------------------------
   DATABASE SETTINGS
------------------------------------------------------- */

const DATASET = "ericlewis/infinite-craft-recipes-21m";

const ELEMENTS_URL =
 "https://huggingface.co/datasets/" + DATASET +
 "/resolve/main/unique_elements_clean.json?download=true";

const API_URL = "https://datasets-server.huggingface.co/filter";

/*
  Version 2 starts a clean game instead of loading the old
  save that may have had every item available.
*/
const SAVE_KEY = "mega_infinite_craft_save_v2";

const STARTERS = [
 {name:"Water",emoji:"💧"},
 {name:"Fire",emoji:"🔥"},
 {name:"Wind",emoji:"🌬️"},
 {name:"Earth",emoji:"🌍"}
];

let elementNames = [];
let discoveries = {};
let canvasItems = [];

let allUnlocked = false;
let currentTab = "discoveries";

let searchResults = [];
let displayLimit = 80;
let searchTimer = null;
let searchVersion = 0;

let combining = false;
let nextId = 1;
let indexLoading = false;

const world = $("world");
const workspace = $("workspace");

/* -------------------------------------------------------
   LOCAL CRAFTING RECIPES

   These recipes work without downloading the huge index.
   The Pokémon chain follows known Infinite Craft-style
   combinations. The special Pickled Jesus chain is
   included so all its ingredients can be crafted too.
------------------------------------------------------- */

const CUSTOM_RECIPES = new Map();

function recipeKey(a,b){
 return [a,b].sort((x,y)=>x.localeCompare(y)).join("|||");
}

function addRecipe(a,b,result,emoji){
 CUSTOM_RECIPES.set(recipeKey(a,b),{
  result,
  emoji:emoji || "✨"
 });
}

const RECIPE_LIST = [

 /* Basic recipes */

 ["Water","Fire","Steam","💨"],
 ["Earth","Wind","Dust","🌫️"],
 ["Water","Water","Lake","🌊"],
 ["Lake","Water","Ocean","🌊"],
 ["Water","Earth","Plant","🌱"],
 ["Earth","Fire","Lava","🌋"],
 ["Water","Wind","Wave","🌊"],
 ["Earth","Wave","Sand","🏖️"],
 ["Sand","Water","Beach","🏖️"],

 /* Pokémon crafting path */

 ["Beach","Lava","Hawaii","🌺"],
 ["Plant","Wave","Seaweed","🌿"],
 ["Hawaii","Seaweed","Poke","🍄"],
 ["Plant","Poke","Pokemon","🐉"],

 /* Pokémon discoveries */

 ["Pokemon","Pokemon","Egg","🥚"],
 ["Pokemon","Egg","Pikachu","⚡"],
 ["Pokemon","Water","Squirtle","🐢"],
 ["Pokemon","Fire","Charizard","🐉"],
 ["Pokemon","Plant","Bulbasaur","🌿"],
 ["Pokemon","Lake","Magikarp","🐟"],
 ["Pokemon","Wind","Flying","🪽"],
 ["Pokemon","Earth","Grass","🌱"],
 ["Pokemon","Pokemon","Egg","🥚"],
 ["Pokemon","Bird","Pidgey","🐦"],
 ["Pidgey","Pidgey","Pidgeotto","🐦"],
 ["Pidgey","Pidgeotto","Pidgeot","🦅"],
 ["Pikachu","Pikachu","Pichu","⚡"],
 ["Pikachu","Pichu","Raichu","⚡"],
 ["Squirtle","Squirtle","Blastoise","🐢"],
 ["Magikarp","Magikarp","Gyarados","🐉"],
 ["Charizard","Charizard","Mega Charizard","🔥"],
 ["Pokemon","Human","Trainer","🧢"],

 /* Other basic crafting */

 ["Plant","Plant","Tree","🌳"],
 ["Tree","Tree","Forest","🌲"],
 ["Tree","Forest","Paper","📄"],
 ["Paper","Paper","Book","📕"],
 ["Plant","Earth","Onion","🧅"],
 ["Fire","Fire","Sun","☀️"],
 ["Plant","Sun","Fruit","🍎"],
 ["Plant","Water","Life","🌱"],
 ["Life","Earth","Human","🧑"],
 ["Human","Book","Religion","📖"],
 ["Religion","Human","Jesus Christ","😇"],

 /* Pickle ingredients */

 ["Water","Lake","Rain","🌧️"],
 ["Fruit","Fire","Wine","🍷"],
 ["Wine","Water","Vinegar","🧪"],
 ["Plant","Lake","Cucumber","🥒"],
 ["Cucumber","Vinegar","Pickle","🥒"],
 ["Onion","Pickle","Pickled Onion","🧅"],
 ["Jesus Christ","Pickled Onion","Pickled Jesus","🍆"],

 /* Sweet and sour ingredients */

 ["Sun","Water","Sugar","🍬"],
 ["Fruit","Water","Lemon","🍋"],
 ["Vinegar","Lemon","Sour","🍋"],
 ["Sugar","Sour","Sweet and Sour Sauce","🍬"],
 ["Jesus Christ","Sweet and Sour Sauce","Sweet And Sour Jesus Christ","🍭"],
 ["Pickled Jesus","Sweet And Sour Jesus Christ","Sweet And Sour Pickled Jesus Christ","🤔"],

 /* Alternate Pickled Jesus Christ route */

 ["Jesus Christ","Pickled Jesus","Pickled Jesus Christ","🥒🙏"],
 ["Sweet And Sour Jesus Christ","Pickled Jesus Christ","Sweet And Sour Pickled Jesus Christ","🤔"]

];

RECIPE_LIST.forEach(r => addRecipe(r[0],r[1],r[2],r[3]));

/* -------------------------------------------------------
   EMOJI LOOKUP
------------------------------------------------------- */

const EMOJIS = {
 "Water":"💧",
 "Fire":"🔥",
 "Wind":"🌬️",
 "Earth":"🌍",
 "Steam":"💨",
 "Dust":"🌫️",
 "Lake":"🌊",
 "Ocean":"🌊",
 "Plant":"🌱",
 "Lava":"🌋",
 "Wave":"🌊",
 "Sand":"🏖️",
 "Beach":"🏖️",
 "Hawaii":"🌺",
 "Seaweed":"🌿",
 "Poke":"🍄",
 "Pokemon":"🐉",
 "Pokémon":"🐉",
 "Egg":"🥚",
 "Pikachu":"⚡",
 "Pichu":"⚡",
 "Raichu":"⚡",
 "Squirtle":"🐢",
 "Blastoise":"🐢",
 "Charizard":"🐉",
 "Bulbasaur":"🌿",
 "Magikarp":"🐟",
 "Gyarados":"🐉",
 "Pidgey":"🐦",
 "Pidgeotto":"🐦",
 "Pidgeot":"🦅",
 "Flying":"🪽",
 "Grass":"🌱",
 "Trainer":"🧢",
 "Tree":"🌳",
 "Forest":"🌲",
 "Paper":"📄",
 "Book":"📕",
 "Onion":"🧅",
 "Sun":"☀️",
 "Fruit":"🍎",
 "Life":"🌱",
 "Human":"🧑",
 "Religion":"📖",
 "Jesus Christ":"😇",
 "Rain":"🌧️",
 "Wine":"🍷",
 "Vinegar":"🧪",
 "Cucumber":"🥒",
 "Pickle":"🥒",
 "Pickled Onion":"🧅",
 "Pickled Jesus":"🍆",
 "Sugar":"🍬",
 "Lemon":"🍋",
 "Sour":"🍋",
 "Sweet and Sour Sauce":"🍬",
 "Sweet And Sour Jesus Christ":"🍭",
 "Pickled Jesus Christ":"🥒🙏",
 "Sweet And Sour Pickled Jesus Christ":"🤔"
};

/* -------------------------------------------------------
   TOAST AND STATUS
------------------------------------------------------- */

function toast(message){
 const el = $("toast");
 el.textContent = message;
 el.classList.add("show");

 clearTimeout(toast.timer);

 toast.timer = setTimeout(() => {
  el.classList.remove("show");
 },2600);
}

function setStatus(message){
 $("status").textContent = message;
}

/* -------------------------------------------------------
   SAVING AND LOADING
------------------------------------------------------- */

function save(){
 try{
  localStorage.setItem(SAVE_KEY,JSON.stringify({
   discoveries,
   canvasItems,
   allUnlocked
  }));
 }catch(e){
  toast("Save storage is full. Your latest progress may not save.");
 }
}

function loadSave(){
 try{
  const raw = localStorage.getItem(SAVE_KEY);

  if(!raw) return false;

  const data = JSON.parse(raw);

  if(!data || typeof data !== "object") return false;

  if(data.discoveries && typeof data.discoveries === "object"){
   discoveries = data.discoveries;
  }

  if(Array.isArray(data.canvasItems)){
   canvasItems = data.canvasItems;
  }

  allUnlocked = data.allUnlocked === true;

  return true;

 }catch(e){
  discoveries = {};
  canvasItems = [];
  allUnlocked = false;
  return false;
 }
}

function addDiscovery(name,emoji="✨"){
 const fresh = !Object.prototype.hasOwnProperty.call(discoveries,name);

 discoveries[name] = emoji || discoveries[name] || "✨";

 return fresh;
}

/*
  A genuinely new game starts with only four items.
  A saved game keeps its saved canvas, even if empty.
*/

function starterSetup(hasSave){
 STARTERS.forEach(item => {
  addDiscovery(item.name,item.emoji);
 });

 if(!hasSave){
  canvasItems = [
   {id:nextId++,name:"Water",emoji:"💧",x:180,y:150},
   {id:nextId++,name:"Fire",emoji:"🔥",x:370,y:150},
   {id:nextId++,name:"Wind",emoji:"🌬️",x:180,y:280},
   {id:nextId++,name:"Earth",emoji:"🌍",x:370,y:280}
  ];
 }

 const highestId = canvasItems.reduce((highest,item) => {
  return Math.max(highest,Number(item.id)||0);
 },0);

 nextId = highestId + 1;
}

/* -------------------------------------------------------
   CANVAS ELEMENTS
------------------------------------------------------- */

function makeElement(item){
 const el = document.createElement("div");

 el.className = "element";
 el.dataset.id = item.id;

 const emoji = document.createElement("span");
 emoji.className = "emoji";
 emoji.textContent = item.emoji || "✨";

 const details = document.createElement("div");

 const name = document.createElement("div");
 name.className = "ename";
 name.textContent = item.name;

 details.appendChild(name);

 if(item.fresh){
  const label = document.createElement("div");
  label.className = "new";
  label.textContent = "✨ First discovery";
  details.appendChild(label);
 }

 el.append(emoji,details);

 el.style.left = item.x + "px";
 el.style.top = item.y + "px";

 el.addEventListener("pointerdown",startDrag);

 return el;
}

function renderCanvas(){
 world.innerHTML = "";

 canvasItems.forEach(item => {
  world.appendChild(makeElement(item));
 });
}

/*
  This is the important protection:
  You cannot add an item unless it is already discovered.
*/

function addToCanvas(name,emoji){
 const isDiscovered =
  Object.prototype.hasOwnProperty.call(discoveries,name);

 const isDeveloperUnlocked =
  allUnlocked && elementNames.includes(name);

 if(!isDiscovered && !isDeveloperUnlocked){
  toast("You haven't discovered that element yet!");
  return;
 }

 if(isDeveloperUnlocked && !isDiscovered){
  addDiscovery(name,emoji || EMOJIS[name] || "✨");
 }

 const x = Math.max(
  20,
  workspace.scrollLeft + 100 + Math.random()*180
 );

 const y = Math.max(
  100,
  workspace.scrollTop + 100 + Math.random()*180
 );

 const item = {
  id:nextId++,
  name,
  emoji:emoji || discoveries[name] || EMOJIS[name] || "✨",
  x,
  y
 };

 canvasItems.push(item);

 renderCanvas();
 save();
}

/* -------------------------------------------------------
   DRAGGING
------------------------------------------------------- */

function startDrag(event){
 if(event.button !== undefined && event.button !== 0) return;

 const el = event.currentTarget;

 const item = canvasItems.find(x => String(x.id) === el.dataset.id);

 if(!item) return;

 event.preventDefault();

 el.setPointerCapture(event.pointerId);
 el.classList.add("dragging");

 const startX = event.clientX;
 const startY = event.clientY;

 const originalX = item.x;
 const originalY = item.y;

 function move(e){
  const dx = e.clientX - startX;
  const dy = e.clientY - startY;

  item.x = Math.max(0,originalX + dx);
  item.y = Math.max(0,originalY + dy);

  el.style.left = item.x + "px";
  el.style.top = item.y + "px";
 }

 function finish(){
  el.removeEventListener("pointermove",move);
  el.removeEventListener("pointerup",finish);
  el.removeEventListener("pointercancel",finish);

  el.classList.remove("dragging");

  const target = findOverlap(item);

  if(target && !combining){
   combineItems(item,target);
  }else{
   save();
  }
 }

 el.addEventListener("pointermove",move);
 el.addEventListener("pointerup",finish);
 el.addEventListener("pointercancel",finish);
}

function findOverlap(item){
 const source = world.querySelector(
  '[data-id="' + item.id + '"]'
 );

 if(!source) return null;

 const a = source.getBoundingClientRect();

 for(const other of canvasItems){
  if(other.id === item.id) continue;

  const el = world.querySelector(
   '[data-id="' + other.id + '"]'
  );

  if(!el) continue;

  const b = el.getBoundingClientRect();

  const overlap =
   a.left < b.right &&
   a.right > b.left &&
   a.top < b.bottom &&
   a.bottom > b.top;

  if(overlap) return other;
 }

 return null;
}

/* -------------------------------------------------------
   RECIPE DATABASE
------------------------------------------------------- */

function sqlString(value){
 return "'" + String(value).replace(/'/g,"''") + "'";
}

async function lookupRecipe(a,b){

 /*
   First check the built-in recipes.
   This makes the Pokémon and Pickled Jesus paths
   work even if the online database is unavailable.
 */

 const local = CUSTOM_RECIPES.get(recipeKey(a,b));

 if(local){
  return local;
 }

 /*
   If no built-in recipe exists, try the online archive.
 */

 let first = a;
 let second = b;

 if(first > second){
  first = b;
  second = a;
 }

 const where =
  '"first"=' + sqlString(first) +
  ' AND "second"=' + sqlString(second) +
  ' AND "is_clean"=true';

 const params = new URLSearchParams({
  dataset:DATASET,
  config:"recipes",
  split:"train",
  where,
  offset:"0",
  length:"1"
 });

 const response = await fetch(
  API_URL + "?" + params.toString()
 );

 if(!response.ok){
  throw new Error(
   "The recipe database returned HTTP " + response.status
  );
 }

 const data = await response.json();

 if(data.error){
  throw new Error(data.error);
 }

 if(!data.rows || !data.rows.length){
  return null;
 }

 const recipe = data.rows[0].row || data.rows[0];

 if(!recipe.result){
  return null;
 }

 return {
  result:recipe.result,
  emoji:recipe.result_emoji || EMOJIS[recipe.result] || "✨"
 };
}

/* -------------------------------------------------------
   COMBINING ELEMENTS
------------------------------------------------------- */

async function combineItems(itemA,itemB){
 if(combining) return;

 combining = true;

 toast(
  "Combining " + itemA.name + " + " + itemB.name + "..."
 );

 try{

  const recipe = await lookupRecipe(
   itemA.name,
   itemB.name
  );

  if(!recipe){
   toast("That combination has no known recipe yet.");
   return;
  }

  const result = recipe.result;
  const emoji = recipe.emoji || EMOJIS[result] || "✨";

  const fresh = addDiscovery(result,emoji);

  const midpointX = (itemA.x + itemB.x)/2;
  const midpointY = (itemA.y + itemB.y)/2;

  canvasItems = canvasItems.filter(x =>
   x.id !== itemA.id &&
   x.id !== itemB.id
  );

  canvasItems.push({
   id:nextId++,
   name:result,
   emoji,
   x:midpointX,
   y:midpointY,
   fresh
  });

  renderCanvas();
  renderSidebar();
  save();

  toast(
   fresh
    ? "✨ FIRST DISCOVERY: " + emoji + " " + result
    : emoji + " " + result
  );

 }catch(error){

  console.error(error);

  toast(
   "Couldn't reach the recipe database. Check your internet and try again."
  );

 }finally{
  combining = false;
 }
}

/* -------------------------------------------------------
   SIDEBAR
------------------------------------------------------- */

function renderSidebar(){
 const list = $("items");

 list.innerHTML = "";

 const query = $("search").value.trim().toLowerCase();

 const isCatalog = currentTab === "catalog";

 $("discoveries-tab").classList.toggle(
  "active",
  !isCatalog
 );

 $("catalog-tab").classList.toggle(
  "active",
  isCatalog
 );

 let source;

 if(isCatalog){

  if(!allUnlocked){
   currentTab = "discoveries";
   renderSidebar();
   return;
  }

  source = query
   ? searchResults
   : elementNames;

  $("list-info").textContent =
   query
    ? searchResults.length + " matching element names"
    : "Developer mode · " +
      elementNames.length.toLocaleString() +
      " elements";

 }else{

  source = Object.keys(discoveries);

  if(query){
   source = source.filter(name =>
    name.toLowerCase().includes(query)
   );
  }

  source.sort((a,b) => a.localeCompare(b));

  $("list-info").textContent =
   Object.keys(discoveries).length.toLocaleString() +
   " discoveries";
 }

 const visible = source.slice(0,displayLimit);

 visible.forEach(value => {

  const name = value;

  const emoji =
   discoveries[name] ||
   EMOJIS[name] ||
   "✨";

  const row = document.createElement("div");
  row.className = "item-row";

  const icon = document.createElement("span");
  icon.className = "item-emoji";
  icon.textContent = emoji;

  const label = document.createElement("span");
  label.className = "item-name";
  label.textContent = name;

  const button = document.createElement("button");
  button.className = "add";
  button.textContent = "Add";

  button.addEventListener("click",() => {
   addToCanvas(name,emoji);
  });

  row.append(icon,label,button);

  list.appendChild(row);
 });

 $("more").style.display =
  source.length > displayLimit
   ? "block"
   : "none";

 $("more").textContent =
  "Show more (" +
  (source.length-displayLimit).toLocaleString() +
  " remaining)";
}

function switchTab(tab){
 if(tab === "catalog" && !allUnlocked){
  return;
 }

 currentTab = tab;

 displayLimit = 80;

 $("search").value = "";

 searchResults = [];

 renderSidebar();
}

function searchCatalog(){
 const query = $("search").value.trim().toLowerCase();

 const version = ++searchVersion;

 if(currentTab === "discoveries"){
  displayLimit = 80;
  renderSidebar();
  return;
 }

 if(!allUnlocked){
  switchTab("discoveries");
  return;
 }

 if(!query){
  searchResults = [];
  displayLimit = 80;
  renderSidebar();
  return;
 }

 clearTimeout(searchTimer);

 searchTimer = setTimeout(() => {

  if(version !== searchVersion) return;

  searchResults = elementNames.filter(name =>
   name.toLowerCase().includes(query)
  ).slice(0,1000);

  displayLimit = 80;

  renderSidebar();

 },120);
}

/* -------------------------------------------------------
   OPTIONAL DEVELOPER INDEX

   This does NOT download on a normal playthrough.
   It only loads after the player clicks Unlock Everything.
------------------------------------------------------- */

async function loadElementIndex(){

 if(elementNames.length){
  return true;
 }

 if(indexLoading){
  return false;
 }

 indexLoading = true;

 $("dev-message").textContent =
  "Downloading the full element index. This may take a little while...";

 try{

  const response = await fetch(ELEMENTS_URL);

  if(!response.ok){
   throw new Error(
    "Element index download failed: " + response.status
   );
  }

  const textData = await response.text();

  const parsed = JSON.parse(textData);

  if(!Array.isArray(parsed)){
   throw new Error("The element index format was unexpected.");
  }

  elementNames = parsed
   .map(item => {
    if(typeof item === "string") return item;
    if(item && typeof item.name === "string") return item.name;
    if(item && typeof item.element === "string") return item.element;
    return null;
   })
   .filter(Boolean);

  elementNames = [...new Set(elementNames)];

  $("dev-message").textContent =
   elementNames.length.toLocaleString() +
   " element names loaded.";

  return true;

 }catch(error){

  console.error(error);

  $("dev-message").textContent =
   "Couldn't download the element index. Check your internet and try again.";

  return false;

 }finally{
  indexLoading = false;
 }
}

/* -------------------------------------------------------
   BUTTONS
------------------------------------------------------- */

$("discoveries-tab").addEventListener(
 "click",
 () => switchTab("discoveries")
);

$("catalog-tab").addEventListener(
 "click",
 () => switchTab("catalog")
);

$("search").addEventListener(
 "input",
 searchCatalog
);

$("more").addEventListener("click",() => {
 displayLimit += 80;
 renderSidebar();
});

$("clear-canvas").addEventListener("click",() => {

 if(!confirm(
  "Remove all elements from the canvas? Your discoveries will stay saved."
 )) return;

 canvasItems = [];

 renderCanvas();

 save();

 toast("Canvas cleared.");
});

$("home-canvas").addEventListener("click",() => {
 workspace.scrollTo({
  left:0,
  top:0,
  behavior:"smooth"
 });
});

$("reset").addEventListener("click",() => {

 if(!confirm(
  "Reset ALL your discoveries and canvas? This cannot be undone."
 )) return;

 localStorage.removeItem(SAVE_KEY);

 location.reload();
});

/* -------------------------------------------------------
   SECRET DEVELOPER PANEL
------------------------------------------------------- */

$("secret-open").addEventListener("click",() => {
 $("secret-backdrop").style.display = "flex";
 $("secret-code").focus();
});

$("secret-close").addEventListener("click",() => {
 $("secret-backdrop").style.display = "none";
});

$("secret-backdrop").addEventListener("click",e => {
 if(e.target === $("secret-backdrop")){
  $("secret-backdrop").style.display = "none";
 }
});

function submitSecret(){

 const accepted =
  $("secret-code").value.trim() === "ilovegeese";

 if(accepted){

  $("dev-panel").style.display = "block";

  $("secret-message").textContent =
   "Code accepted! Developer panel unlocked.";

  $("secret-message").style.color = "#16803c";

 }else{

  $("dev-panel").style.display = "none";

  $("secret-message").textContent =
   "Incorrect code.";

  $("secret-message").style.color = "#c33";
 }
}

$("secret-submit").addEventListener(
 "click",
 submitSecret
);

$("secret-code").addEventListener("keydown",e => {

 if(e.key === "Enter"){
  submitSecret();
 }

 if(e.key === "Escape"){
  $("secret-backdrop").style.display = "none";
 }
});

/*
  Developer unlock is deliberately separate from normal
  gameplay. It reveals the full index only after the code.
*/

$("unlock-all").addEventListener("click",async() => {

 if(!elementNames.length){

  const loaded = await loadElementIndex();

  if(!loaded) return;
 }

 allUnlocked = true;

 $("catalog-tab").style.display = "block";

 save();

 switchTab("catalog");

 $("dev-message").textContent =
  "Developer mode enabled. All " +
  elementNames.length.toLocaleString() +
  " indexed elements are available.";

 toast("Developer mode: all indexed elements unlocked!");
});

/* -------------------------------------------------------
   START GAME
------------------------------------------------------- */

const hadSave = loadSave();

starterSetup(hadSave);

if(allUnlocked){
 $("catalog-tab").style.display = "block";
}

renderCanvas();
renderSidebar();

save();

setStatus(
 Object.keys(discoveries).length.toLocaleString() +
 " discoveries · Start crafting!"
);

/*
  Only reload the full index if developer mode was already
  enabled in a previous saved game.
*/

if(allUnlocked){
 loadElementIndex().then(loaded => {
  if(loaded){
   renderSidebar();
  }
 });
}

})();
</script>
