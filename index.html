
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Infinite Craft</title>
<style>
*{box-sizing:border-box}
:root{
 --bg:#fff;--text:#080808;--border:#d1d1d1;
 --card:#fff;--hover:#f0f5fa;--sidebar:#fff;
 --accent:#8ba9c5;--muted:#777;
}
body.dark{
 --bg:#080808;--text:#fff;--border:#444;
 --card:#151515;--hover:#252a30;--sidebar:#080808;
 --accent:#c1d5e8;--muted:#aaa;
}
*{margin:0}
body{
 background:var(--bg);color:var(--text);
 font-family:Roboto,Arial,sans-serif;overflow:hidden;
 user-select:none;
}
button,input{font:inherit}
button{color:inherit}
#app{height:100dvh;width:100vw;position:relative;background:var(--bg)}
#workspace{
 position:absolute;inset:0 320px 0 0;
 overflow:hidden;
 background-color:var(--bg);
 background-image:radial-gradient(var(--border) .8px,transparent .8px);
 background-size:23px 23px;
 touch-action:none;
}
#workspace.dragging{cursor:grabbing}
#sidebar{
 position:absolute;right:0;top:0;bottom:0;width:320px;
 background:var(--sidebar);border-left:1px solid var(--border);
 display:flex;flex-direction:column;z-index:10;
}
#sidebar-title{padding:18px 15px 12px;font-size:19px;font-weight:bold}
#count{font-weight:400;color:var(--muted);font-size:15px}
#sidebar-tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:0 10px 10px}
.tab{
 padding:9px 4px;border:1px solid var(--border);
 border-radius:7px;background:var(--card);cursor:pointer;
 font-size:13px;
}
.tab.active{background:var(--hover);font-weight:bold;border-color:var(--accent)}
#search{
 width:calc(100% - 20px);margin:0 10px 9px;
 border:1px solid var(--border);background:var(--bg);
 color:var(--text);padding:11px;border-radius:7px;outline:none;
}
#search:focus{border-color:var(--accent)}
#items{
 overflow-y:auto;flex:1;padding:5px 9px 15px;
 display:flex;align-content:flex-start;align-items:flex-start;
 flex-wrap:wrap;gap:7px;
}
.item{
 background:var(--card);border:1px solid var(--border);
 border-radius:7px;padding:7px 9px;cursor:grab;
 display:flex;align-items:center;gap:6px;
 min-height:39px;font-size:14px;white-space:nowrap;
 transition:background .12s,transform .12s;
 touch-action:none;
}
.item:hover{background:var(--hover);transform:scale(1.025)}
.item .emoji{font-size:19px}
.item:active{cursor:grabbing}
.empty{
 width:100%;text-align:center;color:var(--muted);
 padding:25px 8px;font-size:14px;line-height:1.6;
}
#workspace .craft{
 position:absolute;min-width:115px;height:58px;
 padding:0 13px;border:2px solid #9aafc5;
 border-radius:9px;background:linear-gradient(0deg,#f1faff,#fff);
 color:#111;display:flex;align-items:center;gap:9px;
 justify-content:center;font-size:16px;
 cursor:grab;z-index:2;box-shadow:0 2px 5px #0000000b;
 white-space:nowrap;touch-action:none;
 transform:translate(-50%,-50%);
}
body.dark #workspace .craft{
 background:linear-gradient(180deg,#24282d,#101010);
 color:#fff;border-color:#888;
}
.craft:hover{border-color:#5688b5!important;z-index:4}
.craft .emoji{font-size:25px}
.craft.selected{border-color:#4c9bdf!important}
.craft.first:after{
 content:"First Discovery";position:absolute;top:calc(100% + 5px);
 font-size:10px;color:var(--text);white-space:nowrap;
}
.craft.new{animation:pop .35s ease-out}
@keyframes pop{0%{scale:.5}75%{scale:1.08}100%{scale:1}}
#topbar{
 position:absolute;left:14px;top:13px;right:calc(320px + 14px);
 display:flex;align-items:center;gap:10px;z-index:8;
 pointer-events:none;
}
#topbar>*{pointer-events:auto}
#logo{font-size:18px;font-weight:bold;letter-spacing:-.5px}
#top-actions{margin-left:auto;display:flex;gap:7px}
.tool{
 width:38px;height:38px;border:1px solid var(--border);
 border-radius:7px;background:var(--card);cursor:pointer;
 font-size:18px;display:grid;place-items:center;
}
.tool:hover{background:var(--hover)}
#instructions{
 position:absolute;bottom:15px;left:50%;transform:translateX(-50%);
 color:var(--muted);font-size:12px;pointer-events:none;
 white-space:nowrap;text-align:center;
}
#menu{
 position:absolute;bottom:12px;left:12px;z-index:12;
 background:var(--card);border:1px solid var(--border);
 border-radius:7px;padding:8px 12px;cursor:pointer;
}
#menu-panel{
 display:none;position:absolute;bottom:53px;left:12px;
 z-index:20;background:var(--card);border:1px solid var(--border);
 border-radius:9px;padding:7px;width:185px;box-shadow:0 5px 20px #0002;
}
#menu-panel button{
 display:block;width:100%;text-align:left;padding:10px;
 background:transparent;border:0;border-radius:5px;cursor:pointer;
}
#menu-panel button:hover{background:var(--hover)}
#toast{
 position:absolute;top:70px;left:50%;transform:translateX(-50%);
 background:var(--text);color:var(--bg);padding:11px 18px;
 border-radius:8px;font-size:14px;z-index:100;
 opacity:0;pointer-events:none;transition:opacity .2s;
 text-align:center;max-width:90%;
}
#toast.show{opacity:1}
#modal-bg{
 display:none;position:absolute;inset:0;background:#0007;
 z-index:1000;align-items:center;justify-content:center;padding:15px;
}
#modal{
 width:min(380px,100%);max-height:90%;overflow:auto;
 background:var(--card);color:var(--text);
 border:1px solid var(--border);border-radius:12px;
 padding:22px;box-shadow:0 10px 40px #0003;
}
#modal h2{font-size:22px;margin-bottom:7px}
#modal p{font-size:13px;color:var(--muted);margin-bottom:14px}
#modal input{
 width:100%;padding:11px;border-radius:6px;
 border:1px solid var(--border);background:var(--bg);
 color:var(--text);margin-bottom:10px;outline:none;
}
.modal-btn{
 padding:9px 13px;border:1px solid var(--border);
 background:var(--card);border-radius:6px;cursor:pointer;
}
.modal-btn:hover{background:var(--hover)}
#modal-actions{display:flex;gap:8px;flex-wrap:wrap}
#secret-tools{position:absolute;top:12px;right:330px;z-index:50}
#secret-open{
 width:38px;height:38px;border:1px solid var(--border);
 border-radius:7px;background:var(--card);cursor:pointer;font-size:19px;
}
#dev-panel{display:none;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
#dev-panel button{margin:4px 3px 0 0}
#discovery-info{font-size:12px;color:var(--muted);padding:8px 12px}
#sidebar-footer{
 border-top:1px solid var(--border);padding:10px;
 display:flex;justify-content:space-between;align-items:center;
 font-size:12px;color:var(--muted);
}
#sidebar-footer button{
 border:0;background:transparent;color:var(--text);cursor:pointer;
}
#clear-canvas{color:var(--text)}
@media(max-width:700px){
 #workspace{inset:0 0 235px 0}
 #sidebar{
  top:auto;left:0;right:0;bottom:0;width:100%;height:235px;
  border-left:0;border-top:1px solid var(--border);
 }
 #sidebar-title{padding:8px 12px 6px;font-size:16px}
 #sidebar-tabs{padding:0 8px 5px}
 #search{padding:8px;margin-bottom:5px}
 #items{padding:3px 7px;gap:5px}
 .item{padding:5px 7px;min-height:33px;font-size:12px}
 .item .emoji{font-size:16px}
 #topbar{right:10px;top:10px}
 #logo{font-size:15px}
 #secret-tools{right:10px;top:56px}
 #top-actions{gap:4px}
 .tool{width:32px;height:32px}
 #instructions{bottom:243px;font-size:10px}
 #menu{bottom:243px}
 #menu-panel{bottom:283px}
}
</style>
</head>

<div id="app">

<div id="workspace"></div>

<div id="topbar">
 <div id="logo">∞ Infinite Craft</div>
 <div id="top-actions">
  <button class="tool" id="dark-btn" title="Dark Mode">🌙</button>
  <button class="tool" id="clear-btn" title="Clear Canvas">🧹</button>
  <button class="tool" id="sound-btn" title="Sound">🔊</button>
 </div>
</div>

<div id="secret-tools">

</div>

<aside id="sidebar">

</aside>

<button id="menu">☰ Menu</button>
<div id="menu-panel">

 <button id="menu-recipes">📖 Recipe Help</button>
 <button id="menu-reset">♻ Reset Progress</button>
</div>

<div id="instructions">Drag items together to discover something new!</div>
<div id="toast"></div>

<div id="modal-bg">
 <div id="modal">
  <h2 id="modal-title">Secret Code</h2>
  <p id="modal-description">Enter a secret code below.</p>
  <input id="secret-input" type="password" placeholder="Enter code..." autocomplete="off">
  <div id="modal-actions">
   <button class="modal-btn" id="secret-submit">Submit</button>
   <button class="modal-btn" id="modal-close">Close</button>
  </div>
  <div id="secret-message" style="font-size:13px;margin-top:12px"></div>
  <div id="dev-panel">

   <p>Developer tools unlocked!</p>
   <button class="modal-btn" id="unlock-all">✨ Unlock Everything</button>
   <button class="modal-btn" id="dev-clear">Clear Canvas</button>
   <div id="dev-message" style="font-size:13px;margin-top:9px"></div>
  </div>
 </div>
</div>

].forEach(r=>add(...r));

const known={};
START.forEach(x=>known[x.name]=x.emoji);

const extra={
 "Life":"🧬","Human":"🧑","Fish":"🐟","Animal":"🐾",
 "Time":"⏳","Sun":"☀️","Moon":"🌙","Ocean":"🌊",
 "Star":"⭐","Space":"🚀","Universe":"🌌","Love":"❤️",
 "Computer":"💻","Internet":"🌐","Music":"🎵",
 "Food":"🍎","Sound":"🔊","Pressure":"💥","Diamond":"💎",
 "Art":"🎨","Wheat":"🌾","God":"✨","Death":"💀",
 "World":"🌎","War":"⚔️","Weapon":"🗡️"
};
Object.assign(known,extra);

const starterNames=START.map(x=>x.name);
let discoveries=[];
let canvasItems=[];
let activeTab="all";
let sortMode=0;
let dark=false;
let sound=true;
let nextId=1;
let dragging=null;
let dragOffset={x:0,y:0};
let toastTimer;
let saveTimer;
let audio;

function save(){
 try{
  localStorage.setItem("infiniteCraftSave",JSON.stringify({
   discoveries,canvasItems,dark,sortMode
  }));
 }catch(e){}
}
function load(){
 try{
  const data=JSON.parse(localStorage.getItem("infiniteCraftSave")||"null");
  if(data){
   discoveries=Array.isArray(data.discoveries)?data.discoveries:[];
   canvasItems=Array.isArray(data.canvasItems)?data.canvasItems:[];
   dark=!!data.dark;
   sortMode=data.sortMode||0;
  }
 }catch(e){}
 discoveries=discoveries.filter(x=>x&&x.name&&x.emoji);
 canvasItems=canvasItems.filter(x=>x&&x.name&&Number.isFinite(x.x)&&Number.isFinite(x.y));
 canvasItems.forEach(x=>{nextId=Math.max(nextId,(x.id||0)+1)});
 dark=dark;
}
function showToast(message){
 const t=$("toast");
 t.textContent=message;
 t.classList.add("show");
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>t.classList.remove("show"),2200);
}
function playSound(freq=500){
 if(!sound)return;
 try{
  audio=audio||new(window.AudioContext||window.webkitAudioContext)();
  const osc=audio.createOscillator();
  const gain=audio.createGain();
  osc.connect(gain);gain.connect(audio.destination);
  osc.frequency.value=freq;
  gain.gain.setValueAtTime(.06,audio.currentTime);
  gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.14);
  osc.start();osc.stop(audio.currentTime+.15);
 }catch(e){}
}
function normalize(name){return name.trim().toLowerCase()}
function recipe(a,b){
 const result=recipes[[a,b].sort().join("|")];
 return result||null;
}
function addDiscovery(name,emoji){
 if(!known[name])known[name]=emoji||"✨";
 if(discoveries.some(x=>x.name===name))return false;
 discoveries.unshift({name,emoji:emoji||known[name],time:Date.now()});
 save();
 renderSidebar();
 return true;
}
function createCanvasItem(name,emoji,x,y,first=false){
 const item={id:nextId++,name,emoji:emoji||known[name]||"✨",x,y,first};
 canvasItems.push(item);
 renderCanvas();
 save();
 return item;
}
function workspacePoint(e){
 const rect=$("workspace").getBoundingClientRect();
 return {x:e.clientX-rect.left,y:e.clientY-rect.top};
}
function renderCanvas(){
 const ws=$("workspace");
 ws.querySelectorAll(".craft").forEach(el=>el.remove());
 canvasItems.forEach(item=>{
  const el=document.createElement("div");
  el.className="craft"+(item.first?" first":"");
  el.dataset.id=item.id;
  el.style.left=item.x+"px";
  el.style.top=item.y+"px";
  el.innerHTML=`<span class="emoji"></span><span class="name"></span>`;
  el.querySelector(".emoji").textContent=item.emoji;
  el.querySelector(".name").textContent=item.name;
  el.addEventListener("pointerdown",startMove);
  el.addEventListener("dblclick",()=>combineItemWithNearby(item));
  ws.appendChild(el);
 });
}
function renderSidebar(){
 const container=$("items");
 container.innerHTML="";
 const q=normalize($("search").value);
 let list=activeTab==="discoveries"
  ?discoveries.map(x=>({name:x.name,emoji:x.emoji}))
  :Object.keys(known).map(name=>({name,emoji:known[name]}));
 list=list.filter(x=>normalize(x.name).includes(q));
 if(sortMode===1)list.sort((a,b)=>a.name.localeCompare(b.name));
 if(sortMode===2)list.sort((a,b)=>b.name.localeCompare(a.name));
 if(!list.length){
  const empty=document.createElement("div");
  empty.className="empty";
  empty.textContent=activeTab==="discoveries"
   ?"No discoveries yet. Start combining elements!":"No items found.";
  container.appendChild(empty);
 }else{
  list.forEach(item=>{
   const el=document.createElement("div");
   el.className="item";
   const emoji=document.createElement("span");
   emoji.className="emoji";emoji.textContent=item.emoji;
   const name=document.createElement("span");
   name.textContent=item.name;
   el.append(emoji,name);
   el.addEventListener("pointerdown",e=>startSidebarDrag(e,item));
   container.appendChild(el);
  });
 }
 $("count").textContent="("+Object.keys(known).length+")";
 $("discovery-info").textContent=discoveries.length+" discoveries";
 $("sort-btn").textContent="↕ Sort: "+["Recent","A-Z","Z-A"][sortMode];
}
function setTab(tab){
 activeTab=tab;
 $("all-tab").classList.toggle("active",tab==="all");
 $("discoveries-tab").classList.toggle("active",tab==="discoveries");
 renderSidebar();
}
function startSidebarDrag(e,item){
 if(e.button!==0&&e.pointerType==="mouse")return;
 e.preventDefault();
 const ghost=document.createElement("div");
 ghost.className="craft";
 ghost.style.position="fixed";
 ghost.style.left=e.clientX+"px";
 ghost.style.top=e.clientY+"px";
 ghost.style.zIndex=10000;
 ghost.style.pointerEvents="none";
 ghost.innerHTML=`<span class="emoji">${item.emoji}</span><span>${item.name}</span>`;
 document.body.appendChild(ghost);
 const move=ev=>{
  ghost.style.left=ev.clientX+"px";ghost.style.top=ev.clientY+"px";
 };
 const up=ev=>{
  window.removeEventListener("pointermove",move);
  window.removeEventListener("pointerup",up);
  ghost.remove();
  const rect=$("workspace").getBoundingClientRect();
  if(ev.clientX>=rect.left&&ev.clientX<=rect.right&&ev.clientY>=rect.top&&ev.clientY<=rect.bottom){
   const p={x:ev.clientX-rect.left,y:ev.clientY-rect.top};
   const first=addDiscovery(item.name,item.emoji);
   createCanvasItem(item.name,item.emoji,p.x,p.y,first);
   playSound(420);
  }
 };
 window.addEventListener("pointermove",move);
 window.addEventListener("pointerup",up);
}
function startMove(e){
 if(e.button!==0&&e.pointerType==="mouse")return;
 e.preventDefault();
 const el=e.currentTarget;
 const item=canvasItems.find(x=>x.id===Number(el.dataset.id));
 if(!item)return;
 dragging=item;
 const p=workspacePoint(e);
 dragOffset={x:p.x-item.x,y:p.y-item.y};
 el.classList.add("selected");
 $("workspace").classList.add("dragging");
 el.setPointerCapture?.(e.pointerId);
 const move=ev=>{
  if(!dragging)return;
  const point=workspacePoint(ev);
  item.x=Math.max(50,Math.min($("workspace").clientWidth-50,point.x-dragOffset.x));
  item.y=Math.max(70,Math.min($("workspace").clientHeight-40,point.y-dragOffset.y));
  el.style.left=item.x+"px";el.style.top=item.y+"px";
 };
 const up=()=>{
  window.removeEventListener("pointermove",move);
  window.removeEventListener("pointerup",up);
  el.classList.remove("selected");
  $("workspace").classList.remove("dragging");
  const current=dragging;dragging=null;
  if(current)checkCollisions(current);
  save();
 };
 window.addEventListener("pointermove",move);
 window.addEventListener("pointerup",up);
}
function checkCollisions(item){
 const other=canvasItems.find(x=>{
  if(x.id===item.id)return false;
  const dx=x.x-item.x,dy=x.y-item.y;
  return Math.abs(dx)<100&&Math.abs(dy)<60;
 });
 if(other)combine(item,other);
}
function combineItemWithNearby(item){checkCollisions(item)}
function combine(a,b){
 if(!canvasItems.some(x=>x.id===a.id)||!canvasItems.some(x=>x.id===b.id))return;
 const result=recipe(a.name,b.name);
 if(!result){
  showToast("Nothing happened... Try a different combination!");
  playSound(180);
  return;
 }
 const first=addDiscovery(result.name,result.emoji);
 const x=(a.x+b.x)/2;
 const y=(a.y+b.y)/2;
 canvasItems=canvasItems.filter(i=>i.id!==a.id&&i.id!==b.id);
 const item={id:nextId++,name:result.name,emoji:result.emoji,x,y,first};
 canvasItems.push(item);
 renderCanvas();
 renderSidebar();
 save();
 if(first){
  showToast("✨ FIRST DISCOVERY: "+result.emoji+" "+result.name+"!");
  playSound(850);
 }else{
  showToast(result.emoji+" "+result.name+"!");
  playSound(560);
 }
}
function clearCanvas(){
 if(!canvasItems.length){showToast("Your canvas is already empty!");return}
 if(!confirm("Clear all items from your canvas? Your discoveries will be saved."))return;
 canvasItems=[];
 renderCanvas();save();
}
function resetProgress(){
 if(!confirm("Reset ALL progress? This will delete your discoveries and saved canvas."))return;
 localStorage.removeItem("infiniteCraftSave");
 discoveries=[];
 canvasItems=[];
 nextId=1;
 knownClear();
 START.forEach(x=>known[x.name]=x.emoji);
 renderCanvas();renderSidebar();
 showToast("Progress reset!");
}
function knownClear(){
 Object.keys(known).forEach(k=>delete known[k]);
}
function toggleDark(){
 dark=!dark;
 document.body.classList.toggle("dark",dark);
 $("dark-btn").textContent=dark?"☀️":"🌙";
 save();
}
function showModal(){
 $("modal-bg").style.display="flex";
 $("secret-input").focus();
}
function closeModal(){$("modal-bg").style.display="none"}
function unlockAll(){
 const names=new Set();
 Object.values(recipes).forEach(r=>names.add(r.name));
 names.forEach(name=>{
  if(!known[name])known[name]=extra[name]||"✨";
  addDiscovery(name,known[name]);
 });
 renderSidebar();
 save();
 $("dev-message").textContent="✨ Unlocked "+names.size+" crafting results!";
 showToast("Developer mode: everything unlocked!");
}
function showRecipeHelp(){
 alert("How to play:\\n\\n1. Drag an item from the sidebar onto the canvas.\\n2. Drag one canvas item on top of another.\\n3. If a recipe exists, a new item will appear!\\n4. Discoveries are saved automatically.\\n\\nTip: Try combining the four starting elements in different ways!");
}

$("all-tab").onclick=()=>setTab("all");
$("discoveries-tab").onclick=()=>setTab("discoveries");
$("search").addEventListener("input",renderSidebar);
$("sort-btn").onclick=()=>{sortMode=(sortMode+1)%3;renderSidebar();save()};
$("dark-btn").onclick=toggleDark;
$("clear-btn").onclick=clearCanvas;
$("menu-clear").onclick=()=>{ $("menu-panel").style.display="none";clearCanvas()};
$("menu-dark").onclick=()=>{ $("menu-panel").style.display="none";toggleDark()};
$("menu-reset").onclick=()=>{ $("menu-panel").style.display="none";resetProgress()};
$("menu-recipes").onclick=()=>{ $("menu-panel").style.display="none";showRecipeHelp()};
$("menu").onclick=()=>{
 $("menu-panel").style.display=$("menu-panel").style.display==="block"?"none":"block";
};
$("secret-open").onclick=showModal;
$("modal-close").onclick=closeModal;
$("modal-bg").addEventListener("click",e=>{if(e.target===$("modal-bg"))closeModal()});
$("secret-submit").onclick=()=>{
 if($("secret-input").value==="ilovegeese"){
  $("dev-panel").style.display="block";
  $("secret-message").textContent="Code accepted! Developer panel unlocked.";
  $("secret-message").style.color="#159447";
  playSound(850);
 }else{
  $("secret-message").textContent="Incorrect code!";
  $("secret-message").style.color="#d33";
  $("dev-panel").style.display="none";
 }
};
$("secret-input").addEventListener("keydown",e=>{
 if(e.key==="Enter")$("secret-submit").click();
 if(e.key==="Escape")closeModal();
});
$("unlock-all").onclick=unlockAll;
$("dev-clear").onclick=()=>{
 canvasItems=[];renderCanvas();save();
 $("dev-message").textContent="Canvas cleared!";
};
$("sound-btn").onclick=()=>{
 sound=!sound;
 $("sound-btn").textContent=sound?"🔊":"🔇";
 if(sound)playSound(500);
};
$("menu-dark").textContent="🌙 Toggle Dark Mode";

load();
document.body.classList.toggle("dark",dark);
$("dark-btn").textContent=dark?"☀️":"🌙";
$("sound-btn").textContent="🔊";
renderSidebar();
renderCanvas();

// Place starting elements on a fresh canvas.
if(canvasItems.length===0){
 const positions=[
  [160,160],[340,160],[160,290],[340,290]
 ];
 START.forEach((item,i)=>{
  const first=addDiscovery(item.name,item.emoji);
  createCanvasItem(item.name,item.emoji,positions[i][0],positions[i][1],false);
 });
 save();
}

// Keep saved canvas within the visible area after resizing.
window.addEventListener("resize",()=>{
 canvasItems.forEach(item=>{
  item.x=Math.max(50,Math.min($("workspace").clientWidth-50,item.x));
  item.y=Math.max(70,Math.min($("workspace").clientHeight-40,item.y));
 });
 renderCanvas();save();
});

})();
</script>
